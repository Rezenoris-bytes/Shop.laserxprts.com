name: Deploy to Hostinger

# Runs on every push to main, and can be triggered manually from GitHub's
# Actions tab (workflow_dispatch) for re-deployments without a code change.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Only one deployment may run at a time. A new push while a deploy is running
# waits rather than cancels, so migrations always complete.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: '20.x'

jobs:
  # ── API → crm.laserxprts.com ────────────────────────────────────────────
  # Independent full checkout, since apps/api depends on @lei/shared via an
  # npm workspaces symlink — installing from a subfolder alone would try (and
  # fail) to fetch @lei/shared from the npm registry.
  #
  # NOTE: REPO_DIR below is a placeholder. Confirm the real Application Root
  # Hostinger assigned to the crm.laserxprts.com Node.js App in hPanel before
  # the first run of this workflow, and update the path if it differs.
  deploy-api:
    name: Deploy API → crm.laserxprts.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Deploy, build, migrate and restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Hostinger Business uses port 65002, not 22.
          port: 65002
          timeout: 300s
          script: |
            set -euo pipefail

            REPO_DIR="$HOME/domains/crm.laserxprts.com/repo"
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "First deploy: cloning repository..."
              mkdir -p "$(dirname "$REPO_DIR")"
              git clone ${{ secrets.GIT_REPO_URL }} "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            echo "Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            # .env is rewritten on every deploy so a new/changed variable
            # always reaches the server without manual intervention.
            echo "Writing production .env..."
            printf '%s' "$PRODUCTION_ENV" > .env

            echo "Installing dependencies (full workspace, for @lei/shared resolution)..."
            npm install

            echo "Building shared types..."
            npm run build -w @lei/shared

            echo "Generating Prisma client..."
            npm run db:generate -w @lei/api

            echo "Building API..."
            npm run build -w @lei/api

            # Safe to run on every deploy: only applies migrations not yet applied.
            echo "Running database migrations..."
            npm run db:migrate:deploy -w @lei/api

            # Passenger's standard restart trigger — without this, a
            # successful build never actually starts serving the new code.
            echo "Triggering Passenger restart..."
            mkdir -p tmp
            touch tmp/restart.txt

            echo "✅ API deployed and restarted."
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}

  # ── Web → shop.laserxprts.com ───────────────────────────────────────────
  # Independent full checkout for the same @lei/shared workspace-resolution
  # reason as the API job. No longer depends on deploy-api's build output.
  #
  # NOTE: REPO_DIR below is a placeholder — confirm the real Application Root
  # for the shop.laserxprts.com Node.js App in hPanel before the first run.
  deploy-web:
    name: Deploy Web → shop.laserxprts.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Deploy, build and restart via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 65002
          timeout: 300s
          script: |
            set -euo pipefail

            REPO_DIR="$HOME/domains/shop.laserxprts.com/repo"
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "First deploy: cloning repository..."
              mkdir -p "$(dirname "$REPO_DIR")"
              git clone ${{ secrets.GIT_REPO_URL }} "$REPO_DIR"
            fi

            cd "$REPO_DIR"

            echo "Pulling latest code from main..."
            git fetch origin main
            git reset --hard origin/main

            # Rewritten every deploy — NEXT_PUBLIC_* vars are read at BUILD
            # time by `next build`, so this must be current before building.
            echo "Writing production .env..."
            printf '%s' "$PRODUCTION_ENV" > .env

            echo "Installing dependencies (full workspace, for @lei/shared resolution)..."
            npm install

            echo "Building shared types..."
            npm run build -w @lei/shared

            echo "Building web..."
            npm run build -w @lei/web

            echo "Triggering Passenger restart..."
            mkdir -p tmp
            touch tmp/restart.txt

            echo "✅ Web deployed and restarted."
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
